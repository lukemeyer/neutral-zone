<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutral Zone: Commander Mode</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
    <link rel="stylesheet" href="style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0a0d14;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #top-nav {
            height: 48px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-sizing: border-box;
            z-index: 10;
        }

        .nav-title {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dom-meter-wrap {
            flex: 1;
            max-width: 480px;
            margin: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .dom-bar-container {
            height: 10px;
            background: #21262d;
            border-radius: 5px;
            display: flex;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .dom-bar-p1 {
            background: #1f6feb;
            height: 100%;
            transition: width 0.3s ease;
        }

        .dom-bar-p2 {
            background: #f85149;
            height: 100%;
            transition: width 0.3s ease;
        }

        .dom-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-family: monospace;
        }

        .top-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .top-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .top-btn:hover {
            background: #30363d;
            color: #ffffff;
        }

        .top-btn.active {
            background: #1f6feb;
            border-color: #58a6ff;
            color: #ffffff;
        }

        .classic-link {
            color: #8b949e;
            text-decoration: none;
            font-size: 12px;
            margin-left: 10px;
        }

        .classic-link:hover {
            color: #58a6ff;
        }

        #game-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        #canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background: #0a0d14;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Floating Minimal Tactical HUD */
        #tactical-dock {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 27, 34, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(48, 54, 61, 0.85);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
            max-width: 96%;
            user-select: none;
        }

        .dock-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dock-divider {
            width: 1px;
            height: 24px;
            background: #30363d;
        }

        .dock-stat {
            font-size: 12px;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .dock-val-blue {
            font-weight: bold;
            color: #58a6ff;
            font-size: 14px;
        }

        .dock-val-red {
            font-weight: bold;
            color: #ff7b72;
            font-size: 14px;
        }

        .dock-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            min-width: 80px;
        }

        .dock-btn:hover {
            background: #30363d;
            color: #ffffff;
            border-color: #58a6ff;
        }

        .dock-btn.highlight {
            background: #1f6feb;
            border-color: #58a6ff;
            color: #ffffff;
        }

        .dock-btn.highlight:hover {
            background: #388bfd;
        }

        .dock-btn-row {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: space-between;
            width: 100%;
        }

        .dock-cost {
            font-size: 9px;
            opacity: 0.85;
            background: rgba(0,0,0,0.3);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .dock-prog-wrap {
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 1.5px;
            overflow: hidden;
            margin-top: 2px;
        }

        .dock-prog {
            height: 100%;
            background: #3fb950;
            width: 0%;
            transition: width 0.1s linear;
        }

        .dock-queue-pips {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-top: 3px;
        }

        .dock-queue-pips .pip {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #30363d;
            border: 1px solid #21262d;
            transition: all 0.15s ease;
        }

        .dock-queue-pips .pip.active {
            background: #3fb950;
            box-shadow: 0 0 4px rgba(63, 185, 80, 0.8);
        }

        .dock-queue-pips .pip.waiting {
            background: #58a6ff;
            box-shadow: 0 0 4px rgba(88, 166, 255, 0.8);
        }

        .dock-btn.blocked {
            opacity: 0.45;
            cursor: not-allowed;
            border-color: #da3633 !important;
        }

        .dock-stance-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .dock-stance-btn:hover {
            color: #ffffff;
            background: #30363d;
        }

        .dock-stance-btn.active {
            color: #ffffff;
        }

        .dock-stance-btn#btn-stance-patrol.active {
            background: #1f6feb;
            border-color: #58a6ff;
            box-shadow: 0 0 8px rgba(31, 111, 235, 0.4);
        }

        .dock-stance-btn#btn-stance-defend.active {
            background: #d29922;
            border-color: #e3b341;
            box-shadow: 0 0 8px rgba(210, 153, 34, 0.4);
        }

        .dock-stance-btn#btn-stance-attack.active {
            background: #da3633;
            border-color: #f85149;
            box-shadow: 0 0 8px rgba(218, 54, 51, 0.4);
        }

        .dock-intel-stance {
            font-weight: bold;
            font-size: 11px;
            color: #ffffff;
            background: rgba(248, 81, 73, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(248, 81, 73, 0.4);
        }

        #game-over-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 13, 20, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-box {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .modal-box h2 {
            margin-top: 0;
            font-size: 28px;
        }

        .btn-restart {
            background: #1f6feb;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-restart:hover {
            background: #388bfd;
        }

        /* Mobile & Responsive Adaptations */
        @media (max-width: 768px) {
            #top-nav {
                height: auto;
                min-height: 44px;
                padding: 6px 10px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .nav-title {
                font-size: 13px;
            }
            .dom-meter-wrap {
                order: 3;
                width: 100%;
                max-width: 100%;
                margin: 2px 0 4px 0;
            }
            .top-actions {
                gap: 4px;
            }
            .top-btn {
                padding: 4px 8px;
                font-size: 11px;
            }
            #tactical-dock {
                bottom: 8px;
                padding: 6px 8px;
                gap: 6px;
                max-width: 98%;
                flex-wrap: wrap;
                justify-content: center;
            }
            .dock-divider {
                display: none;
            }
            .dock-section {
                gap: 6px;
                justify-content: center;
            }
            .dock-stat {
                font-size: 11px;
            }
            .dock-btn {
                min-width: 68px;
                padding: 4px 6px;
                font-size: 10px;
            }
            .dock-stance-btn {
                padding: 4px 6px;
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            #tactical-dock {
                bottom: 4px;
                padding: 4px 6px;
                gap: 4px;
                width: calc(100% - 12px);
                border-radius: 8px;
            }
            .dock-btn {
                min-width: 60px;
                padding: 3px 5px;
                font-size: 9.5px;
            }
            .dock-cost {
                font-size: 8px;
                padding: 0 2px;
            }
            .dock-stance-btn {
                padding: 4px 6px;
                font-size: 9.5px;
            }
            .dock-stat {
                font-size: 10px;
            }
            .dock-val-blue, .dock-val-red {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div id="top-nav">
        <div class="nav-title">
            <span>⭐</span> Neutral Zone <span style="font-weight:normal;color:#8b949e">| Commander</span>
        </div>

        <div class="dom-meter-wrap">
            <div class="dom-bar-container">
                <div id="dom-bar-p1" class="dom-bar-p1" style="width: 2%;"></div>
                <div style="flex:1"></div>
                <div id="dom-bar-p2" class="dom-bar-p2" style="width: 2%;"></div>
            </div>
            <div class="dom-labels">
                <span style="color:#58a6ff">P1 Blue: <span id="p1-control">5.9 (2.0%)</span></span>
                <span style="color:#8b949e">Goal: 50% Domination</span>
                <span style="color:#ff7b72">P2 Red: <span id="p2-control">5.9 (2.0%)</span></span>
            </div>
        </div>

        <div class="top-actions">
            <button id="btn-pause" class="top-btn">⏸ Pause</button>
            <button id="btn-speed-1x" class="top-btn active">1x</button>
            <button id="btn-speed-2x" class="top-btn">2x</button>
            <a href="hex.html" class="classic-link" style="color: #2ea043; font-weight: 600;">⬡ Hex</a>
            <a href="index.html" class="classic-link">← Classic</a>
        </div>
    </div>

    <div id="game-area">
        <div id="canvas-container">
            <canvas id="commander-canvas"></canvas>

            <!-- Floating Minimal Tactical HUD -->
            <div id="tactical-dock">
                <!-- P1 Blue Stats -->
                <div class="dock-section">
                    <span class="dock-stat">⚡ <span id="p1-energy" class="dock-val-blue">150</span> E</span>
                    <span class="dock-stat" style="color:#8b949e">📡 <b id="p1-stations" style="color:#fff">3</b></span>
                    <span class="dock-stat" style="color:#8b949e">⛏️ <b id="p1-miners" style="color:#3fb950">2</b></span>
                    <span class="dock-stat" style="color:#8b949e">✈️ <b id="p1-fighters" style="color:#58a6ff">3</b></span>
                </div>

                <div class="dock-divider"></div>

                <!-- Macro Build Production -->
                <div class="dock-section">
                    <button id="btn-build-station" class="dock-btn highlight" title="Expand Station Perimeter (50 Energy) • Aim trajectory arrow to steer (Q/E or Click/Drag)">
                        <div class="dock-btn-row"><span>📡 +Station</span><span class="dock-cost">50E</span></div>
                        <div class="dock-prog-wrap"><div id="p1-prog-station" class="dock-prog"></div></div>
                        <div id="p1-queue-station" class="dock-queue-pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                    </button>
                    <button id="btn-build-miner" class="dock-btn" title="Commission Miner (25 Energy)">
                        <div class="dock-btn-row"><span>⛏️ +Miner</span><span class="dock-cost">25E</span></div>
                        <div class="dock-prog-wrap"><div id="p1-prog-miner" class="dock-prog"></div></div>
                        <div id="p1-queue-miner" class="dock-queue-pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                    </button>
                    <button id="btn-build-fighter" class="dock-btn" title="Commission Fighter (75 Energy)">
                        <div class="dock-btn-row"><span>✈️ +Fighter</span><span class="dock-cost">75E</span></div>
                        <div class="dock-prog-wrap"><div id="p1-prog-fighter" class="dock-prog"></div></div>
                        <div id="p1-queue-fighter" class="dock-queue-pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                    </button>
                </div>

                <div class="dock-divider"></div>

                <!-- Global Fleet Orders (Stance) -->
                <div class="dock-section">
                    <button id="btn-stance-patrol" class="dock-stance-btn active" title="Patrol frontier border facing enemy (Hotkey: 1)">🔄 1: Patrol</button>
                    <button id="btn-stance-defend" class="dock-stance-btn" title="Hold at HQ, scramble when threatened (Hotkey: 2)">🛡️ 2: Defend</button>
                    <button id="btn-stance-attack" class="dock-stance-btn" title="Assault enemy forward stations & base (Hotkey: 3)">⚔️ 3: Attack</button>
                </div>

                <div class="dock-divider"></div>

                <!-- Enemy Intel -->
                <div class="dock-section">
                    <span class="dock-stat" style="color:#ff7b72">🔴 Red: ⚡ <span id="p2-energy" class="dock-val-red">150</span></span>
                    <span id="p2-stance" class="dock-intel-stance">PATROL</span>
                    <span class="dock-stat" style="color:#8b949e">📡 <b id="p2-stations" style="color:#fff">3</b> ⛏️ <b id="p2-miners" style="color:#3fb950">2</b> ✈️ <b id="p2-fighters" style="color:#ff7b72">3</b></span>
                </div>
            </div>

            <!-- Game Over Modal -->
            <div id="game-over-modal" style="display:none;">
                <div class="modal-box">
                    <h2 id="game-over-text">Victory!</h2>
                    <button id="btn-restart" class="btn-restart">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/commander/commander_main.js"></script>
</body>
</html>
