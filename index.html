<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutral Zone - Prototype</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: sans-serif;
            user-select: none;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 1280px;
            height: 720px;
            transform-origin: center center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #top-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            pointer-events: none;
        }

        .panel {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border: 1px solid #444;
            border-radius: 8px;
            text-align: center;
        }

        .player-ui {
            position: absolute;
            bottom: 40px;
            width: 180px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #ui-p1 {
            left: 128px;
            transform: translateX(-50%);
        }

        #ui-p2 {
            left: 1152px;
            transform: translateX(-50%);
        }

        .energy-display {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2ea043;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
            color: #888;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .setup-box {
            background: #161b22;
            padding: 40px;
            border: 1px solid #30363d;
            border-radius: 12px;
            text-align: center;
        }

        .setup-row {
            display: flex;
            justify-content: space-around;
            gap: 40px;
            margin: 30px 0;
        }

        .player-setup select {
            background: #0d1117;
            color: white;
            border: 1px solid #30363d;
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            margin-top: 10px;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .result-box {
            background: #161b22;
            padding: 40px;
            border: 1px solid #30363d;
            border-radius: 12px;
            text-align: center;
        }

        #game-result-text {
            margin-bottom: 30px;
            font-size: 32px;
        }

        #btn-restart-game {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #btn-restart-game:hover {
            background: #2ea043;
        }
    </style>
</head>

<body>

    <div id="game-over-screen" style="display: none;">
        <div class="result-box">
            <h2 id="game-result-text">Player Wins!</h2>
            <button id="btn-restart-game">Play Again</button>
        </div>
    </div>

    <div id="start-screen">
        <div class="setup-box">
            <h1>Neutral Zone</h1>
            <div class="setup-row">
                <div class="player-setup">
                    <h2 style="color:#1f6feb">Player 1 (Left)</h2>
                    <select id="p1-type">
                        <option value="human">Human</option>
                        <option value="cpu">CPU (Auto)</option>
                    </select>
                </div>
                <div class="player-setup">
                    <h2 style="color:#f85149">Player 2 (Right)</h2>
                    <select id="p2-type">
                        <option value="cpu">CPU (Auto)</option>
                        <option value="human">Human</option>
                    </select>
                </div>
            </div>
            <button id="btn-start-game" style="font-size: 20px; padding: 12px 30px;">Start Game</button>
        </div>
    </div>

    <div id="game-container">
        <div id="top-bar">
            <div class="panel">
                <span style="color:#2ea043">P1 Control: <span id="p1-control">0.0</span>%</span>
                &nbsp; | &nbsp;
                <span style="color:#da3633">P2 Control: <span id="p2-control">0.0</span>%</span>
            </div>
        </div>

        <div id="ui-p1" class="player-ui">
            <div class="energy-display" style="color:#1f6feb">Energy: <span id="p1-energy">50</span></div>
            <button id="p1-btn-miner">Build Miner (25)</button>
            <button id="p1-btn-scout">Build Scout (50)</button>
            <button id="p1-btn-fighter">Build Fighter (100)</button>
        </div>

        <div id="ui-p2" class="player-ui">
            <div class="energy-display" style="color:#f85149">Energy: <span id="p2-energy">50</span></div>
            <button id="p2-btn-miner">Build Miner (25)</button>
            <button id="p2-btn-scout">Build Scout (50)</button>
            <button id="p2-btn-fighter">Build Fighter (100)</button>
        </div>

        <div
            style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #aaa; text-align: center; pointer-events: none;">
            <b>Controls:</b> Drag <b>Scouts</b> (Circles) to expand territory. Drag from <b>Fighters</b> (Triangles) to
            patrol.
        </div>

        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function handleResize() {
            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            container.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', handleResize);
        handleResize();

        // Game State (Multiplayer)
        const players = [
            {
                id: 0,
                color: '#1f6feb', // Blue (Player 1)
                territoryColor: '#2ea043',
                energy: 100,
                homePlanet: { x: 128, y: 360, radius: 30, health: 1000, maxHealth: 1000 },
                units: { scouts: [], fighters: [], miners: [] },
                isCPU: false,
                aiTimer: 0,
                scoutSettleTimer: 0
            },
            {
                id: 1,
                color: '#f85149', // Red (Player 2)
                territoryColor: '#da3633',
                energy: 100,
                homePlanet: { x: 1152, y: 360, radius: 30, health: 1000, maxHealth: 1000 },
                units: { scouts: [], fighters: [], miners: [] },
                isCPU: false,
                aiTimer: 0,
                scoutSettleTimer: 0
            }
        ];

        const asteroids = [];
        // Generate Left Side Asteroids
        const generateAsteroids = () => {
            const leftAsteroids = [];
            // Guaranteed asteroid near P1
            leftAsteroids.push({
                x: players[0].homePlanet.x + 80,
                y: players[0].homePlanet.y,
                radius: 15, miners: 0,
                resources: Math.floor(Math.random() * 400 + 200)
            });
            // Random asteroids on left half
            for (let i = 1; i < 6; i++) {
                leftAsteroids.push({
                    x: Math.random() * (640 - 250) + 250, // Keep outside initial territory
                    y: Math.random() * (720 - 100) + 50,
                    radius: 15, miners: 0,
                    resources: Math.floor(Math.random() * 400 + 200)
                });
            }
            return leftAsteroids;
        };

        const leftAsteroids = generateAsteroids();
        // Add left side and mirrored right side (only mirror horizontally)
        leftAsteroids.forEach(a => {
            asteroids.push({ ...a });
            asteroids.push({
                x: 1280 - a.x,
                y: a.y,
                radius: 15, miners: 0,
                resources: a.resources
            });
        });

        // Setup Initial Units for both players
        players.forEach(p => {
            const dirX = p.homePlanet.x < 640 ? 1 : -1;
            p.units.scouts.push({ x: p.homePlanet.x - (100 * dirX), y: p.homePlanet.y - 100, targetX: p.homePlanet.x - (100 * dirX), targetY: p.homePlanet.y - 100, health: 50, maxHealth: 50, cooldown: 0 });
            p.units.scouts.push({ x: p.homePlanet.x + (100 * dirX), y: p.homePlanet.y - 100, targetX: p.homePlanet.x + (100 * dirX), targetY: p.homePlanet.y - 100, health: 50, maxHealth: 50, cooldown: 0 });
            p.units.scouts.push({ x: p.homePlanet.x, y: p.homePlanet.y + 120, targetX: p.homePlanet.x, targetY: p.homePlanet.y + 120, health: 50, maxHealth: 50, cooldown: 0 });
            p.units.miners.push({ x: p.homePlanet.x, y: p.homePlanet.y, targetAsteroid: null, payload: 0, returning: false, health: 20, maxHealth: 20 });
        });

        let projectiles = [];

        // Interaction State
        let activeScout = null;
        let activeScoutPlayer = null;
        let activeFighter = null;
        let drawingPath = false;
        let gameStarted = false;
        let gameOver = false;

        // Convex Hull Algorithm (Monotone Chain) to calculate territory
        function getConvexHull(points) {
            if (points.length <= 2) return points;
            const sorted = [...points].sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x);
            const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
            const lower = [];
            for (let p of sorted) {
                while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
                lower.push(p);
            }
            const upper = [];
            for (let i = sorted.length - 1; i >= 0; i--) {
                let p = sorted[i];
                while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
                upper.push(p);
            }
            upper.pop(); lower.pop();
            return lower.concat(upper);
        }

        function pointInPolygon(point, vs) {
            let x = point.x, y = point.y;
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i].x, yi = vs[i].y;
                let xj = vs[j].x, yj = vs[j].y;

                // Ray-casting algorithm
                let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) / (rect.width / canvas.width),
                y: (e.clientY - rect.top) / (rect.height / canvas.height)
            };
        }

        // Input Handling
        canvas.addEventListener('mousedown', (e) => {
            if (!gameStarted) return;
            const pos = getMousePos(e);
            const mouseX = pos.x;
            const mouseY = pos.y;

            // Check Fighters first (for drawing path)
            for (let p of players) {
                if (p.isCPU) continue;
                for (let f of p.units.fighters) {
                    if (Math.hypot(f.x - mouseX, f.y - mouseY) < 20) {
                        activeFighter = f;
                        activeFighter.path = [{ x: mouseX, y: mouseY }];
                        drawingPath = true;
                        return;
                    }
                }
            }

            // Check Scouts (for dragging target)
            for (let p of players) {
                if (p.isCPU) continue;
                for (let s of p.units.scouts) {
                    // Check against current position OR its target ghost
                    if (Math.hypot(s.x - mouseX, s.y - mouseY) < 20 || Math.hypot(s.targetX - mouseX, s.targetY - mouseY) < 20) {
                        activeScout = s;
                        activeScoutPlayer = p; // need to track which player's scout is active for hull checking
                        return;
                    }
                }
            }
        });

        const MAX_EDGE_LENGTH = 350;

        canvas.addEventListener('mousemove', (e) => {
            if (!gameStarted) return;
            const pos = getMousePos(e);
            const mouseX = pos.x;
            const mouseY = pos.y;

            if (activeScout && activeScoutPlayer) {
                const originalX = activeScout.targetX;
                const originalY = activeScout.targetY;
                const proposedX = mouseX;
                const proposedY = mouseY;

                const checkHullValid = (x, y) => {
                    activeScout.targetX = x;
                    activeScout.targetY = y;
                    const points = [activeScoutPlayer.homePlanet, ...activeScoutPlayer.units.scouts.map(s => ({ x: s.targetX, y: s.targetY }))];
                    const hull = getConvexHull(points);

                    let perimeter = 0;
                    for (let i = 0; i < hull.length; i++) {
                        let p1 = hull[i];
                        let p2 = hull[(i + 1) % hull.length];
                        perimeter += Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    }

                    const MAX_PERIMETER = (activeScoutPlayer.units.scouts.length + 1) * 350;
                    return perimeter <= MAX_PERIMETER;
                };

                if (checkHullValid(proposedX, proposedY)) {
                    activeScout.targetX = proposedX;
                    activeScout.targetY = proposedY;
                } else {
                    if (checkHullValid(originalX, originalY)) {
                        let low = 0;
                        let high = 1;
                        let bestT = 0;
                        for (let step = 0; step < 10; step++) {
                            let mid = (low + high) / 2;
                            let testX = originalX + (proposedX - originalX) * mid;
                            let testY = originalY + (proposedY - originalY) * mid;
                            if (checkHullValid(testX, testY)) {
                                bestT = mid;
                                low = mid;
                            } else {
                                high = mid;
                            }
                        }
                        activeScout.targetX = originalX + (proposedX - originalX) * bestT;
                        activeScout.targetY = originalY + (proposedY - originalY) * bestT;
                    } else {
                        activeScout.targetX = originalX;
                        activeScout.targetY = originalY;
                    }
                }
            }
            if (drawingPath && activeFighter) {
                const lastPoint = activeFighter.path[activeFighter.path.length - 1];
                if (Math.hypot(lastPoint.x - mouseX, lastPoint.y - mouseY) > 15) {
                    activeFighter.path.push({ x: mouseX, y: mouseY });
                }
            }
        });

        const handleMouseUpOrLeave = (e) => {
            if (drawingPath && activeFighter) {
                // Check if path is closed (loop)
                const firstP = activeFighter.path[0];
                const lastP = activeFighter.path[activeFighter.path.length - 1];
                if (activeFighter.path.length > 5 && Math.hypot(firstP.x - lastP.x, firstP.y - lastP.y) < 30) {
                    activeFighter.isLoop = true;
                    activeFighter.path.push({ x: firstP.x, y: firstP.y }); // close the visual gap
                } else {
                    activeFighter.isLoop = false;
                }
                activeFighter.pathIndex = 0;
                activeFighter.pathDir = 1;
            }
            activeScout = null;
            activeScoutPlayer = null;
            activeFighter = null;
            drawingPath = false;
        };

        canvas.addEventListener('mouseup', handleMouseUpOrLeave);
        canvas.addEventListener('mouseleave', handleMouseUpOrLeave);

        // AI Logic
        function updateAI(p, dt) {
            // Check if any scouts are currently moving
            const scoutsMoving = p.units.scouts.some(s => Math.hypot(s.targetX - s.x, s.targetY - s.y) > 5);

            if (scoutsMoving) {
                p.scoutSettleTimer = 0;
                return; // Wait for them to arrive
            }

            p.scoutSettleTimer += dt;
            if (p.scoutSettleTimer < 1.0) return; // Wait 1 second after they stop before doing new things

            p.aiTimer += dt;
            if (p.aiTimer < 1.0) return; // run AI logic every 1s
            p.aiTimer = 0;

            const enemy = players.find(ep => ep.id !== p.id);

            // 1) Combat Fighters (Defensive & Offensive)
            if (p.units.fighters.length < enemy.units.fighters.length && p.energy >= 100) {
                // Defensive: Match opponent numbers
                p.energy -= 100;
                let patrolOffset = p.id === 0 ? 300 : -300;
                p.units.fighters.push({ x: p.homePlanet.x, y: p.homePlanet.y, path: [{ x: p.homePlanet.x + patrolOffset, y: p.homePlanet.y - 200 }, { x: p.homePlanet.x + patrolOffset, y: p.homePlanet.y + 200 }], pathIndex: 1, pathDir: 1, isLoop: false, health: 100, maxHealth: 100, cooldown: 0 });
            } else if (p.units.miners.length >= 2 && p.energy >= 200) {
                // Offensive: Economy is stable, push for the win
                p.energy -= 100; // still costs 100, but requires a 200 surplus to trigger
                p.units.fighters.push({ x: p.homePlanet.x, y: p.homePlanet.y, path: [{ x: p.homePlanet.x, y: p.homePlanet.y }, { x: enemy.homePlanet.x, y: enemy.homePlanet.y }], pathIndex: 1, pathDir: 1, isLoop: false, health: 100, maxHealth: 100, cooldown: 0 });
            }

            // 2) Expansion (Scouts target closest neutral asteroid)
            const currentPoints = [p.homePlanet, ...p.units.scouts.map(s => ({ x: s.targetX, y: s.targetY }))];
            const currentHull = getConvexHull(currentPoints);

            // Helper to see if asteroid + a 25px radius buffer is entirely inside our current hull
            const isAstCaptured = (a) => {
                const offsets = [[0, 0], [25, 0], [-25, 0], [0, 25], [0, -25]];
                return offsets.every(off => pointInPolygon({ x: a.x + off[0], y: a.y + off[1] }, currentHull));
            };

            let closestAst = null;
            let minDist = Infinity;

            // Check if we have active captured asteroids being mined
            let activeCaptured = asteroids.filter(a => a.resources > 0 && isAstCaptured(a));

            // Only expand if we have fully mined our current captures (or have none yet)
            if (activeCaptured.length === 0) {
                asteroids.forEach(a => {
                    if (a.resources > 0 && !isAstCaptured(a)) {
                        let d = Math.hypot(p.homePlanet.x - a.x, p.homePlanet.y - a.y);
                        if (d < minDist) {
                            minDist = d;
                            closestAst = a;
                        }
                    }
                });
            }

            let activeExpansionScout = null;

            if (closestAst) {
                // Find a scout to do the expanding. Prefer one not moving much.
                activeExpansionScout = p.units.scouts.find(s => Math.hypot(s.targetX - s.x, s.targetY - s.y) < 5);
                if (activeExpansionScout) {
                    let dirX = closestAst.x - p.homePlanet.x;
                    let dirY = closestAst.y - p.homePlanet.y;
                    let len = Math.hypot(dirX, dirY) || 1;
                    activeExpansionScout.targetX = closestAst.x + (dirX / len) * 60;
                    activeExpansionScout.targetY = closestAst.y + (dirY / len) * 60;
                } else if (p.energy >= 50) {
                    p.energy -= 50;
                    p.units.scouts.push({ x: p.homePlanet.x, y: p.homePlanet.y, targetX: p.homePlanet.x, targetY: p.homePlanet.y, health: 50, maxHealth: 50, cooldown: 0 });
                }
            }

            // Assign holding positions for captured asteroids
            let holdingScouts = [];
            activeCaptured.forEach(a => {
                let available = p.units.scouts.filter(s => s !== activeExpansionScout && !holdingScouts.includes(s));
                if (available.length > 0) {
                    // Find the scout closest to this rock
                    let holder = available.sort((s1, s2) => Math.hypot(s1.x - a.x, s1.y - a.y) - Math.hypot(s2.x - a.x, s2.y - a.y))[0];
                    let dirX = a.x - p.homePlanet.x;
                    let dirY = a.y - p.homePlanet.y;
                    let len = Math.hypot(dirX, dirY) || 1;
                    // Push the holding scout just slightly past the rock (matching expansion offset) to guarantee it stays in bounds without oscillating
                    holder.targetX = a.x + (dirX / len) * 60;
                    holder.targetY = a.y + (dirY / len) * 60;
                    holdingScouts.push(holder);
                }
            });

            // Distribute remaining scouts to maintain a wide defensive perimeter
            const idleScouts = p.units.scouts.filter(s => s !== activeExpansionScout && !holdingScouts.includes(s));
            if (idleScouts.length > 0) {
                // We want to form a semi-circle facing the center of the board.
                const dir = p.id === 0 ? 1 : -1;
                const angleSpread = Math.PI; // 180 degree fan
                const startAngle = dir === 1 ? -Math.PI / 2 : Math.PI / 2;

                // Get the average distance of our current hull to push the perimeter out slightly
                let avgDist = 150;
                if (closestAst) {
                    avgDist = Math.max(150, Math.hypot(closestAst.x - p.homePlanet.x, closestAst.y - p.homePlanet.y));
                }

                idleScouts.forEach((s, i) => {
                    // evenly space them along the arc
                    const pct = idleScouts.length === 1 ? 0.5 : i / (idleScouts.length - 1);
                    const angle = startAngle + (pct * angleSpread);

                    s.targetX = p.homePlanet.x + Math.cos(angle) * avgDist * dir;
                    s.targetY = p.homePlanet.y + Math.sin(angle) * avgDist;
                });
            }

            // 3) Economy (Miners)
            // Count captured asteroids
            let capturedAsteroids = asteroids.filter(a => a.resources > 0 && isAstCaptured(a));
            if (p.units.miners.length < capturedAsteroids.length * 2 && p.energy >= 25) {
                p.energy -= 25;
                p.units.miners.push({ x: p.homePlanet.x, y: p.homePlanet.y, targetAsteroid: null, payload: 0, returning: false, health: 20, maxHealth: 20 });
            }
        }

        // Game Loop
        let lastTime = 0;
        function update(time) {
            const dt = (time - lastTime) / 1000 || 0;
            lastTime = time;

            if (!gameStarted) return;

            // UI Refresh for both players
            document.getElementById('p1-energy').innerText = Math.floor(players[0].energy);
            document.getElementById('p1-btn-miner').disabled = players[0].energy < 25;
            document.getElementById('p1-btn-scout').disabled = players[0].energy < 50;
            document.getElementById('p1-btn-fighter').disabled = players[0].energy < 100;

            document.getElementById('p2-energy').innerText = Math.floor(players[1].energy);
            document.getElementById('p2-btn-miner').disabled = players[1].energy < 25;
            document.getElementById('p2-btn-scout').disabled = players[1].energy < 50;
            document.getElementById('p2-btn-fighter').disabled = players[1].energy < 100;

            const currentHulls = [];

            // Update Players
            players.forEach(p => {
                if (p.isCPU) updateAI(p, dt);

                const currentPoints = [p.homePlanet, ...p.units.scouts.map(s => ({ x: s.x, y: s.y }))];
                const currentHull = getConvexHull(currentPoints);
                currentHulls.push(currentHull);

                // Control Area Calculation
                let area = 0;
                for (let i = 0; i < currentHull.length; i++) {
                    let j = (i + 1) % currentHull.length;
                    area += currentHull[i].x * currentHull[j].y;
                    area -= currentHull[j].x * currentHull[i].y;
                }
                area = Math.abs(area / 2);
                const totalArea = 1280 * 720;
                const pct = (area / totalArea) * 100;

                if (pct >= 70.0 && !gameOver) {
                    endGame(p.id, 'Domination');
                }

                if (p.id === 0) {
                    document.getElementById('p1-control').innerText = pct.toFixed(1);
                } else {
                    document.getElementById('p2-control').innerText = pct.toFixed(1);
                }

                p.units.scouts.forEach(s => {
                    let dx = s.targetX - s.x;
                    let dy = s.targetY - s.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist > 2) {
                        s.x += (dx / dist) * 40 * dt;
                        s.y += (dy / dist) * 40 * dt;
                    } else {
                        s.x = s.targetX;
                        s.y = s.targetY;
                    }
                });

                p.units.fighters.forEach(f => {
                    if (f.path && f.path.length > 1 && f !== activeFighter) {
                        let targetPoint = f.path[f.pathIndex];
                        let dx = targetPoint.x - f.x;
                        let dy = targetPoint.y - f.y;
                        let dist = Math.hypot(dx, dy);

                        if (dist < 5) {
                            f.pathIndex += f.pathDir;
                            if (f.pathIndex >= f.path.length || f.pathIndex < 0) {
                                if (f.isLoop) {
                                    f.pathIndex = 0;
                                } else {
                                    f.pathDir *= -1;
                                    f.pathIndex += f.pathDir * 2;
                                }
                            }
                        } else {
                            f.x += (dx / dist) * 80 * dt;
                            f.y += (dy / dist) * 80 * dt;
                        }
                    }
                });

                p.units.miners.forEach(m => {
                    if (m.payload === undefined) m.payload = 0;
                    if (m.returning === undefined) m.returning = false;

                    if (m.returning) {
                        let dx = p.homePlanet.x - m.x;
                        let dy = p.homePlanet.y - m.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist > p.homePlanet.radius) {
                            m.x += (dx / dist) * 50 * dt;
                            m.y += (dy / dist) * 50 * dt;
                        } else {
                            p.energy += m.payload;
                            m.payload = 0;
                            m.returning = false;
                        }
                    } else if (!m.targetAsteroid || m.targetAsteroid.resources <= 0) {
                        if (m.targetAsteroid) {
                            m.targetAsteroid.miners = Math.max(0, m.targetAsteroid.miners - 1);
                            m.targetAsteroid = null;
                        }

                        let closest = null;
                        let minDist = Infinity;
                        asteroids.forEach(a => {
                            if (a.resources > 0 && a.miners < 3 && pointInPolygon(a, currentHull)) {
                                let d = Math.hypot(a.x - m.x, a.y - m.y);
                                if (d < minDist) { minDist = d; closest = a; }
                            }
                        });

                        if (closest) {
                            m.targetAsteroid = closest;
                            closest.miners++;
                        } else if (m.payload > 0) {
                            m.returning = true;
                        }
                    } else {
                        let dx = m.targetAsteroid.x - m.x;
                        let dy = m.targetAsteroid.y - m.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist > 20) {
                            m.x += (dx / dist) * 50 * dt;
                            m.y += (dy / dist) * 50 * dt;
                        } else {
                            // Mining
                            let amount = Math.min(m.targetAsteroid.resources, 10 * dt);
                            m.targetAsteroid.resources -= amount;
                            m.payload += amount;
                            if (m.payload >= 25) {
                                m.payload = 25;
                                m.returning = true;
                                m.targetAsteroid.miners = Math.max(0, m.targetAsteroid.miners - 1);
                                m.targetAsteroid = null;
                            }
                        }
                    }
                });

                // Combat Logic
                const enemyP = players.find(ep => ep.id !== p.id);

                // Fighters attack anything
                p.units.fighters.forEach(f => {
                    if (f.cooldown > 0) f.cooldown -= dt;
                    if (f.cooldown <= 0) {
                        let target = null;
                        let minDist = 200; // Fighter Range

                        // Check Enemy Planet
                        let dPlanet = Math.hypot(enemyP.homePlanet.x - f.x, enemyP.homePlanet.y - f.y);
                        if (dPlanet < minDist) { minDist = dPlanet; target = { type: 'planet', ref: enemyP.homePlanet }; }

                        // Check Enemy Units
                        ['fighters', 'scouts', 'miners'].forEach(type => {
                            enemyP.units[type].forEach(u => {
                                let d = Math.hypot(u.x - f.x, u.y - f.y);
                                if (d < minDist) { minDist = d; target = { type: 'unit', ref: u }; }
                            });
                        });

                        if (target) {
                            projectiles.push({ x: f.x, y: f.y, target: target, damage: 10, speed: 300, ownerId: p.id, color: p.color });
                            f.cooldown = 0.5; // Firerate
                        }
                    }
                });

                // Scouts attack only fighters
                p.units.scouts.forEach(s => {
                    if (s.cooldown > 0) s.cooldown -= dt;
                    if (s.cooldown <= 0) {
                        let target = null;
                        let minDist = 150; // Scout defensive range

                        enemyP.units.fighters.forEach(f => {
                            let d = Math.hypot(f.x - s.x, f.y - s.y);
                            if (d < minDist) { minDist = d; target = { type: 'unit', ref: f }; }
                        });

                        if (target) {
                            projectiles.push({ x: s.x, y: s.y, target: target, damage: 5, speed: 400, ownerId: p.id, color: p.territoryColor });
                            s.cooldown = 0.3; // Firerate
                        }
                    }
                });
            });

            // Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                let tx = proj.target.type === 'planet' ? proj.target.ref.x : proj.target.ref.x;
                let ty = proj.target.type === 'planet' ? proj.target.ref.y : proj.target.ref.y;
                let dx = tx - proj.x;
                let dy = ty - proj.y;
                let dist = Math.hypot(dx, dy);

                if (dist < 10) {
                    proj.target.ref.health -= proj.damage;
                    projectiles.splice(i, 1);
                } else {
                    proj.x += (dx / dist) * proj.speed * dt;
                    proj.y += (dy / dist) * proj.speed * dt;
                }
            }

            // Cleanup Dead Entities
            players.forEach(p => {
                p.units.scouts = p.units.scouts.filter(u => u.health > 0);
                p.units.fighters = p.units.fighters.filter(u => u.health > 0);
                p.units.miners = p.units.miners.filter(u => {
                    if (u.health <= 0 && u.targetAsteroid) {
                        u.targetAsteroid.miners = Math.max(0, u.targetAsteroid.miners - 1);
                    }
                    return u.health > 0;
                });

                // Keep dead planets around for visual ruin or end game state, but cap at 0
                if (p.homePlanet.health <= 0) p.homePlanet.health = 0;
            });

            if (gameOver) return;
            players.forEach(p => {
                // Destruction Loss
                if (p.homePlanet.health <= 0) {
                    endGame(players.find(ep => ep.id !== p.id).id, 'Destruction');
                }
                // Bankruptcy Loss
                let totalUnits = p.units.scouts.length + p.units.fighters.length + p.units.miners.length;
                if (totalUnits === 0 && p.energy < 25) {
                    endGame(players.find(ep => ep.id !== p.id).id, 'Bankruptcy');
                }
            });
        }

        function endGame(winnerId, reason) {
            if (gameOver) return;
            gameOver = true;
            document.getElementById('game-over-screen').style.display = 'flex';
            const winnerName = winnerId === 0 ? "Player 1 (Blue)" : "Player 2 (Red)";
            document.getElementById('game-result-text').innerText = `${winnerName} Wins via ${reason}!`;
            document.getElementById('game-result-text').style.color = winnerId === 0 ? '#1f6feb' : '#f85149';
        }

        function drawHealthBar(x, y, current, max, width = 20) {
            if (current >= max) return; // Only draw when damaged
            const pct = Math.max(0, current / max);
            ctx.fillStyle = 'red';
            ctx.fillRect(x - width / 2, y, width, 4);
            ctx.fillStyle = '#2ea043';
            ctx.fillRect(x - width / 2, y, width * pct, 4);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Territories
            players.forEach(p => {
                const currentPoints = [p.homePlanet, ...p.units.scouts.map(s => ({ x: s.x, y: s.y }))];
                const currentHull = getConvexHull(currentPoints);

                // Projected
                let isProjecting = p.units.scouts.some(s => Math.hypot(s.targetX - s.x, s.targetY - s.y) > 5);
                if (isProjecting) {
                    const targetPoints = [p.homePlanet, ...p.units.scouts.map(s => ({ x: s.targetX, y: s.targetY }))];
                    const targetHull = getConvexHull(targetPoints);
                    ctx.beginPath();
                    targetHull.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
                    ctx.closePath();
                    ctx.fillStyle = p.id === 0 ? 'rgba(46, 160, 67, 0.1)' : 'rgba(218, 54, 51, 0.1)';
                    ctx.fill();
                    ctx.setLineDash([10, 10]);
                    ctx.strokeStyle = p.id === 0 ? 'rgba(46, 160, 67, 0.5)' : 'rgba(218, 54, 51, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Current
                ctx.beginPath();
                currentHull.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
                ctx.closePath();
                ctx.fillStyle = p.id === 0 ? 'rgba(46, 160, 67, 0.25)' : 'rgba(218, 54, 51, 0.25)';
                ctx.fill();
                ctx.strokeStyle = p.territoryColor;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Fighter Paths
                p.units.fighters.forEach(f => {
                    if (f.path && f.path.length > 0) {
                        ctx.beginPath();
                        ctx.moveTo(f.path[0].x, f.path[0].y);
                        for (let i = 1; i < f.path.length; i++) ctx.lineTo(f.path[i].x, f.path[i].y);
                        ctx.strokeStyle = p.id === 0 ? 'rgba(88, 166, 255, 0.4)' : 'rgba(248, 81, 73, 0.4)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
            });

            // Draw Asteroids
            asteroids.forEach(a => {
                if (a.resources <= 0) return;
                ctx.beginPath();
                ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#8b949e';
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(Math.ceil(a.resources), a.x, a.y - a.radius - 5);
            });

            // Draw Units & Planets
            players.forEach(p => {
                // Home Planet
                ctx.beginPath();
                ctx.arc(p.homePlanet.x, p.homePlanet.y, p.homePlanet.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                drawHealthBar(p.homePlanet.x, p.homePlanet.y + 40, p.homePlanet.health, p.homePlanet.maxHealth, 40);

                // Scouts
                p.units.scouts.forEach(s => {
                    if (Math.hypot(s.targetX - s.x, s.targetY - s.y) > 5) {
                        drawCircle(s.targetX, s.targetY, p.id === 0 ? 'rgba(46, 160, 67, 0.4)' : 'rgba(218, 54, 51, 0.4)', 10);
                    }
                    drawCircle(s.x, s.y, p.territoryColor, 10);
                    drawHealthBar(s.x, s.y - 20, s.health, s.maxHealth);
                });

                // Fighters
                p.units.fighters.forEach(f => {
                    drawTriangle(f.x, f.y, p.color);
                    drawHealthBar(f.x, f.y - 20, f.health, f.maxHealth);
                });

                // Miners
                p.units.miners.forEach(m => {
                    drawSquare(m.x, m.y, m.returning ? '#a371f7' : (p.id === 0 ? '#d2a8ff' : '#ff7b72'));
                    if (m.payload > 0) {
                        const ratio = m.payload / 25;
                        ctx.fillStyle = '#2ea043';
                        ctx.fillRect(m.x - 4, (m.y + 4) - (8 * ratio), 8, 8 * ratio);
                    }
                    drawHealthBar(m.x, m.y - 20, m.health, m.maxHealth);
                });
            });

            // Draw Projectiles
            projectiles.forEach(proj => {
                ctx.beginPath();
                ctx.moveTo(proj.x, proj.y);
                ctx.lineTo(proj.x - (proj.target.ref.x - proj.x > 0 ? 5 : -5), proj.y - (proj.target.ref.y - proj.y > 0 ? 5 : -5)); // Simple trail
                ctx.strokeStyle = proj.color;
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            requestAnimationFrame((t) => {
                update(t);
                draw();
            });
        }

        // Drawing Helpers
        function drawTriangle(x, y, color) {
            ctx.beginPath();
            ctx.moveTo(x, y - 10);
            ctx.lineTo(x + 10, y + 10);
            ctx.lineTo(x - 10, y + 10);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawCircle(x, y, color, radius) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawSquare(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x - 8, y - 8, 16, 16);
        }

        // UI Buttons 
        document.getElementById('p1-btn-miner').addEventListener('click', () => {
            if (players[0].energy >= 25) {
                players[0].energy -= 25;
                players[0].units.miners.push({ x: players[0].homePlanet.x, y: players[0].homePlanet.y, targetAsteroid: null, payload: 0, returning: false, health: 20, maxHealth: 20 });
            }
        });
        document.getElementById('p1-btn-scout').addEventListener('click', () => {
            if (players[0].energy >= 50) {
                players[0].energy -= 50;
                players[0].units.scouts.push({ x: players[0].homePlanet.x, y: players[0].homePlanet.y, targetX: players[0].homePlanet.x + 50, targetY: players[0].homePlanet.y + 50, health: 50, maxHealth: 50, cooldown: 0 });
            }
        });
        document.getElementById('p1-btn-fighter').addEventListener('click', () => {
            if (players[0].energy >= 100) {
                players[0].energy -= 100;
                players[0].units.fighters.push({ x: players[0].homePlanet.x, y: players[0].homePlanet.y, path: [{ x: players[0].homePlanet.x, y: players[0].homePlanet.y }, { x: players[0].homePlanet.x, y: players[0].homePlanet.y - 60 }], pathIndex: 1, pathDir: 1, isLoop: false, health: 100, maxHealth: 100, cooldown: 0 });
            }
        });

        document.getElementById('p2-btn-miner').addEventListener('click', () => {
            if (players[1].energy >= 25) {
                players[1].energy -= 25;
                players[1].units.miners.push({ x: players[1].homePlanet.x, y: players[1].homePlanet.y, targetAsteroid: null, payload: 0, returning: false, health: 20, maxHealth: 20 });
            }
        });
        document.getElementById('p2-btn-scout').addEventListener('click', () => {
            if (players[1].energy >= 50) {
                players[1].energy -= 50;
                players[1].units.scouts.push({ x: players[1].homePlanet.x, y: players[1].homePlanet.y, targetX: players[1].homePlanet.x - 50, targetY: players[1].homePlanet.y + 50, health: 50, maxHealth: 50, cooldown: 0 });
            }
        });
        document.getElementById('p2-btn-fighter').addEventListener('click', () => {
            if (players[1].energy >= 100) {
                players[1].energy -= 100;
                players[1].units.fighters.push({ x: players[1].homePlanet.x, y: players[1].homePlanet.y, path: [{ x: players[1].homePlanet.x, y: players[1].homePlanet.y }, { x: players[1].homePlanet.x, y: players[1].homePlanet.y - 60 }], pathIndex: 1, pathDir: 1, isLoop: false, health: 100, maxHealth: 100, cooldown: 0 });
            }
        });

        document.getElementById('btn-restart-game').addEventListener('click', () => {
            window.location.reload();
        });

        document.getElementById('btn-start-game').addEventListener('click', () => {
            players[0].isCPU = document.getElementById('p1-type').value === 'cpu';
            players[1].isCPU = document.getElementById('p2-type').value === 'cpu';

            if (players[0].isCPU) {
                document.getElementById('p1-btn-miner').style.display = 'none';
                document.getElementById('p1-btn-scout').style.display = 'none';
                document.getElementById('p1-btn-fighter').style.display = 'none';
            }
            if (players[1].isCPU) {
                document.getElementById('p2-btn-miner').style.display = 'none';
                document.getElementById('p2-btn-scout').style.display = 'none';
                document.getElementById('p2-btn-fighter').style.display = 'none';
            }

            document.getElementById('start-screen').style.display = 'none';
            gameStarted = true;
        });

        // Start
        requestAnimationFrame((t) => { lastTime = t; draw(); });</script>
</body>
