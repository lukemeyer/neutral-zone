<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutral Zone - Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-over-screen" style="display: none;">
        <div class="result-box">
            <h2 id="game-result-text">Player Wins!</h2>
            <button id="btn-restart-game">Play Again</button>
        </div>
    </div>

    <div id="start-screen">
        <div class="setup-box">
            <h1>Neutral Zone</h1>
            <div class="setup-row">
                <div class="player-setup">
                    <h2 style="color:#1f6feb">Player 1 (Left)</h2>
                    <select id="p1-type">
                        <option value="human">Human</option>
                        <option value="cpu">CPU (Auto)</option>
                    </select>
                </div>
                <div class="player-setup">
                    <h2 style="color:#f85149">Player 2 (Right)</h2>
                    <select id="p2-type">
                        <option value="cpu">CPU (Auto)</option>
                        <option value="human">Human</option>
                    </select>
                </div>
            </div>
            <button id="btn-start-game" style="font-size: 20px; padding: 12px 30px;">Start Game</button>
        </div>
    </div>

    <div id="game-container">
        <div id="top-bar">
            <div class="panel">
                <span style="color:#2ea043">P1 Control: <span id="p1-control">0.0</span>%</span>
                &nbsp; | &nbsp;
                <span style="color:#da3633">P2 Control: <span id="p2-control">0.0</span>%</span>
            </div>
        </div>

        <div id="ui-p1" class="player-ui">
            <div class="energy-display" style="color:#1f6feb">Energy: <span id="p1-energy">50</span></div>
            <button id="p1-btn-miner">Build Miner (25)</button>
            <button id="p1-btn-scout">Build Scout (50)</button>
            <button id="p1-btn-fighter">Build Fighter (100)</button>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <button id="p1-btn-sel-all" style="flex: 1; font-size: 11px; padding: 5px;">Select All Fighters</button>
                <button id="p1-btn-sel-none" style="flex: 1; font-size: 11px; padding: 5px;">Select None</button>
            </div>
        </div>

        <div id="ui-p2" class="player-ui">
            <div class="energy-display" style="color:#f85149">Energy: <span id="p2-energy">50</span></div>
            <button id="p2-btn-miner">Build Miner (25)</button>
            <button id="p2-btn-scout">Build Scout (50)</button>
            <button id="p2-btn-fighter">Build Fighter (100)</button>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <button id="p2-btn-sel-all" style="flex: 1; font-size: 11px; padding: 5px;">Select All Fighters</button>
                <button id="p2-btn-sel-none" style="flex: 1; font-size: 11px; padding: 5px;">Select None</button>
            </div>
        </div>

        <div
            style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #aaa; text-align: center; pointer-events: none;">
            <b>Controls:</b> Drag <b>Scouts</b> (Circles) to expand territory. Drag from <b>Fighters</b> (Triangles) to
            patrol.
        </div>

        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
